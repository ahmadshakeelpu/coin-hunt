name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires Settings > Pages > Source = "GitHub Actions". On branch
      # publishing GitHub also runs Jekyll over the repo on every push, and
      # whichever pipeline finishes last wins, so the site flips between this
      # build and a Jekyll render of the README. GITHUB_TOKEN cannot change
      # that setting: the Pages API needs admin, which it does not have.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: @tailwindcss/oxide-wasm32-wasi pulls in
      # @emnapi/core and @emnapi/runtime only when resolved on Linux, so a
      # lockfile generated on Windows is always "out of sync" here and npm ci
      # refuses to run. Regenerate the lockfile on Linux to switch to npm ci.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # WORKAROUND. Settings > Pages > Source is still "Deploy from a branch",
      # so GitHub also publishes the repo itself: the home page renders README
      # through Jekyll and every route 404s, whenever that pipeline finishes
      # after this one. Copying the build to the branch root makes both
      # pipelines serve the same real site. .pages-mirror records what was
      # copied so the next run can remove it rather than accumulate stale
      # hashed assets. Delete this step once Source is "GitHub Actions".
      - name: Mirror build into the branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .pages-mirror ]; then
            tr '\n' '\0' < .pages-mirror | xargs -0 -r rm -rf --
          fi
          (cd out && find . -mindepth 1 -maxdepth 1 -printf '%P\n' | sort) > /tmp/mirror-entries
          while IFS= read -r entry; do cp -R "out/$entry" "./$entry"; done < /tmp/mirror-entries
          cp /tmp/mirror-entries .pages-mirror
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already current."
            exit 0
          fi
          git commit -m "Mirror build for branch publishing [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
