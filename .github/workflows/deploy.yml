name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # configure-pages enables Pages but leaves an already-enabled site on
      # branch publishing, which runs Jekyll over the repo and overwrites this
      # deploy. Only the Pages API can move it to Actions publishing.
      - name: Publish from Actions rather than a branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow 2> pages-put.log || true
          echo "::warning::put-stderr[$(tr '\n' ' ' < pages-put.log | head -c 300)] config[$(gh api "repos/${{ github.repository }}/pages" 2>&1 | tr -d '\n' | head -c 400)]"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: @tailwindcss/oxide-wasm32-wasi pulls in
      # @emnapi/core and @emnapi/runtime only when resolved on Linux, so a
      # lockfile generated on Windows is always "out of sync" here and npm ci
      # refuses to run. Regenerate the lockfile on Linux to switch to npm ci.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
